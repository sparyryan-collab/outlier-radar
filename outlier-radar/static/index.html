<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https://i.ytimg.com data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'">
<title>Outlier Radar</title>
<style>
:root{
  --bg:#ffffff; --surface:#f2f2f2; --surface2:#e5e5e5; --text:#0f0f0f; --muted:#606060; --line:#e5e5e5;
  --on-bg:#0f0f0f; --on-fg:#ffffff; --accent:#065fd4; --good:#188038; --warn:#c26a00; --bad:#d93025; --hover:rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f0f0f; --surface:#272727; --surface2:#3f3f3f; --text:#f1f1f1; --muted:#aaaaaa; --line:#303030;
    --on-bg:#f1f1f1; --on-fg:#0f0f0f; --accent:#3ea6ff; --good:#4cc36f; --warn:#f2a33a; --bad:#ff6b61; --hover:rgba(255,255,255,.1);}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/20px Roboto,Arial,"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
#top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg)}
.icon{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.icon:hover{background:var(--hover)}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand svg{color:var(--accent);width:26px;height:26px}
.search{flex:1 1 auto;max-width:640px;margin:0 auto;display:flex;min-width:0}
.search input{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid var(--line);border-right:0;border-radius:40px 0 0 40px;background:var(--bg);outline:none}
.search input:focus{border-color:var(--accent)}
.search button{width:64px;height:40px;border:1px solid var(--line);border-radius:0 40px 40px 0;background:var(--surface);cursor:pointer;display:grid;place-items:center}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;max-width:290px;line-height:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good);animation:pulse 1.6s infinite}
.dot.snap{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pillbtn{height:36px;border:0;border-radius:18px;padding:0 14px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.pillbtn:hover{background:var(--surface2)}
.pillbtn svg{width:20px;height:20px}
.pillbtn.primary{background:var(--on-bg);color:var(--on-fg)}
.pillbtn[disabled]{opacity:.6;cursor:default}
.seg{display:inline-flex;background:var(--surface);border-radius:18px;padding:3px}
.seg button{border:0;background:transparent;height:30px;min-width:44px;padding:0 12px;border-radius:15px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg)}

/* layout */
#layout{display:flex}
#side{position:sticky;top:56px;align-self:flex-start;height:calc(100vh - 56px);width:220px;flex:none;padding:6px 12px;overflow:auto}
.nav{display:flex;align-items:center;gap:20px;width:100%;height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;cursor:pointer;text-align:left;font-size:14px}
.nav:hover{background:var(--hover)}
.nav[aria-current=true]{background:var(--surface);font-weight:600}
.nav .n{margin-left:auto;color:var(--muted);font-size:12px}
.mini #side{width:72px}
.mini .nav{flex-direction:column;gap:4px;height:64px;justify-content:center;padding:0;font-size:10px;text-align:center}
.mini .nav .n,.mini .nav span.lbl small{display:none}
main{flex:1;min-width:0;padding:0 24px 40px}
#chips{position:sticky;top:56px;z-index:10;background:var(--bg);display:flex;gap:10px;align-items:center;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip,#chips select{flex:none;height:32px;border:0;border-radius:8px;padding:0 12px;background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
#chips select{padding:0 8px}
.chip:hover,#chips select:hover{background:var(--surface2)}
.chip[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg)}
.sep{width:1px;height:24px;background:var(--line);flex:none}
details.how{margin:0 0 6px;color:var(--muted);font-size:13px}
details.how summary{cursor:pointer;width:max-content}
details.how p{margin:6px 0 10px;max-width:880px}

/* avatars, chips */
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;color:#fff;flex:none;font-weight:600}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag,.lang{display:inline-block;border-radius:6px;padding:0 8px;font-size:12px;line-height:20px;background:var(--surface);color:var(--muted);white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.pick{background:var(--on-bg);color:var(--on-fg);font-weight:600}
.tr{color:var(--accent);font-size:12px;white-space:nowrap}
.tr:hover{text-decoration:underline}

/* channel rows (like YouTube channel results + Shorts shelf) */
.ch{padding:18px 0 14px;border-bottom:1px solid var(--line)}
.chhead{display:flex;gap:18px;align-items:flex-start}
.chinfo{flex:1;min-width:0}
.chname{font-size:18px;line-height:26px;font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chname a:hover{text-decoration:underline}
.chsub{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chdesc{color:var(--muted);font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:760px}
.chstats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;align-items:center}
.stat b{font-size:15px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{color:var(--muted);font-size:12px;margin-left:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.right{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.ring{--p:0;--c:var(--muted);width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.watchbtn{height:36px;border:0;border-radius:18px;padding:0 16px;background:var(--on-bg);color:var(--on-fg);font-weight:500;cursor:pointer;white-space:nowrap}
.watchbtn.on{background:var(--surface);color:var(--text)}
.note{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);max-width:900px}
.note b{display:block;margin-bottom:2px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:14px 0 6px;scroll-snap-type:x proximity;scrollbar-width:thin}
.short{flex:0 0 148px;scroll-snap-align:start}
.th{position:relative;display:block;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--surface)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.th .views{position:absolute;left:9px;bottom:8px;z-index:1;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.th .x{position:absolute;left:8px;top:8px;z-index:1;background:rgba(0,0,0,.72);color:#fff;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;line-height:20px}
.th .x.mid{background:#c26a00}
.th .x.hi{background:#188038}
.th .g{position:absolute;right:8px;top:8px;z-index:1;background:#065fd4;color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;line-height:18px}
.short .t{margin-top:8px;font-size:14px;line-height:20px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.short .m{color:var(--muted);font-size:12px}

/* shorts grid */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:22px 14px;padding-top:6px}
.vmeta{display:flex;gap:10px;margin-top:10px}
.vtxt{min-width:0;flex:1}
.vt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:14px;line-height:20px}
.vch{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.vch a:hover{color:var(--text)}
.vst{color:var(--muted);font-size:12px}

/* niches */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding-top:6px}
.tile{border:0;text-align:left;border-radius:14px;padding:16px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tile:hover{background:var(--surface2)}
.tile b{font-size:16px;line-height:22px}
.tile small{color:var(--muted);font-size:12px}
.tile .bar2{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.tile .bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lead{color:var(--muted);margin:2px 0 12px}
.empty{padding:56px 16px;text-align:center;color:var(--muted)}
.more{display:block;margin:18px auto;height:36px;border:0;border-radius:18px;padding:0 20px;background:var(--surface);cursor:pointer;font-weight:500}
.more:hover{background:var(--surface2)}
footer{margin-top:28px;color:var(--muted);font-size:12px;max-width:820px}

/* dialog */
dialog{border:0;background:var(--bg);color:var(--text);border-radius:16px;padding:0;width:min(660px,94vw);max-height:88vh;box-shadow:0 12px 48px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:20px 22px;overflow:auto;max-height:86vh}
.dlg h3{margin:0 0 4px;font-size:18px}
.dlg p{margin:0;color:var(--muted)}
.row{display:flex;gap:8px;margin:10px 0 14px}
.row input{flex:1;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
.row input:focus{border-color:var(--accent)}
.qlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.q{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border-radius:8px;padding:0 4px 0 10px;line-height:28px;font-size:13px}
.q.dead{opacity:.5}
.q small{color:var(--muted)}
.q button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 6px;font-size:15px}
pre.log{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:12px;max-height:160px;overflow:auto;white-space:pre-wrap;margin:6px 0 0}

@media (max-width:1100px){.pillbtn .lbl{display:none}.pillbtn{padding:0 10px}#side{width:72px}#side .nav{flex-direction:column;gap:4px;height:64px;justify-content:center;padding:0;font-size:10px;text-align:center}#side .nav .n{display:none}.status{display:none}}
@media (max-width:760px){
  #top{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
  .search{order:5;flex:1 1 100%;max-width:none}
  .actions{gap:6px}.pillbtn .lbl{display:none}.pillbtn{padding:0 10px}
  #chips{top:0;position:static}
  #side{position:fixed;inset:auto 0 0 0;top:auto;z-index:30;width:auto;height:58px;display:flex;padding:0 4px;background:var(--bg);border-top:1px solid var(--line)}
  #side .nav{height:56px;flex:1}
  main{padding:0 12px 80px}
  .chhead{flex-wrap:wrap}.right{flex-direction:row;width:100%;justify-content:space-between}
  .brand span{display:none}
}
</style>
</head>
<body>
<header id="top">
  <button class="icon" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div class="brand"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-5"/></svg><span>Outlier Radar</span></div>
  <form class="search" id="searchForm" role="search"><input id="fq" type="search" autocomplete="off"><button type="submit" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></form>
  <div class="actions">
    <div class="status" id="status"></div>
    <button class="pillbtn primary" id="btnScan"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span class="lbl" id="scanLbl"></span></button>
    <button class="pillbtn" id="btnExport"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span class="lbl" id="exportLbl"></span></button>
    <button class="pillbtn" id="btnSettings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="lbl" id="settingsLbl"></span></button>
    <div class="seg" id="langSeg" role="group" aria-label="Language"><button data-ui="en" aria-pressed="true">EN</button><button data-ui="th" aria-pressed="false">ไทย</button></div>
  </div>
</header>
<div id="layout">
  <nav id="side" aria-label="Sections"></nav>
  <main>
    <div id="chips"></div>
    <details class="how"><summary id="howSum"></summary><p id="howBody"></p></details>
    <div id="content"></div>
    <footer id="foot"></footer>
  </main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

function channelsView(list, empty) {
  if (!list.length) return `<div class="empty">${esc(empty || t('emptyCh'))}</div>`;
  const lim = shown.channels;
  return list.slice(0, lim).map(channelRow).join('') +
    (list.length > lim ? `<button class="more" data-more="channels">${esc(t('more', {n: list.length - lim}))}</button>` : '');
}
function videosView() {
  const vids = [];
  for (const c of channelsFiltered(false)) for (const v of c.series) if (v.x >= S.minX) vids.push([v, c]);
  const key = {x: ([v]) => v.x, v: ([v]) => v.v, g: ([v]) => (v.g && v.h ? v.g / v.h : -1)}[S.vsort];
  vids.sort((a, b) => key(b) - key(a));
  if (!vids.length) return `<div class="empty">${esc(t('emptyVid'))}</div>`;
  const lim = shown.videos;
  return `<div class="vgrid">${vids.slice(0, lim).map(([v, c]) => vCard(v, c)).join('')}</div>` +
    (vids.length > lim ? `<button class="more" data-more="videos">${esc(t('more', {n: vids.length - lim}))}</button>` : '');
}
function nichesView() {
  const map = new Map();
  for (const c of channelsFiltered(true)) for (const nq of c.queries) {
    const m = map.get(nq) || {n: 0, strong: 0, scores: []};
    m.n++; m.scores.push(c.score); if (c.score >= 55) m.strong++;
    map.set(nq, m);
  }
  const rows = [...map.entries()].map(([k, m]) => {
    const top = m.scores.sort((a, b) => b - a).slice(0, 5);
    return {k, ...m, avg: top.reduce((a, b) => a + b, 0) / top.length};
  }).sort((a, b) => b.strong - a.strong || b.avg - a.avg).slice(0, 60);
  if (!rows.length) return `<div class="empty">${esc(t('emptyNiche'))}</div>`;

    `<button class="tile" data-niche="${esc(r.k)}"><b>${esc(r.k)}</b><div class="bar2"><i style="width:${(r.strong / mx) * 100}%"></i></div><small>${esc(t('nicheStats', {s: r.strong, a: Math.round(r.avg), n: r.n}))}</small></button>`).join('') + '</div>';
}
function liveVideos() {

  const engine = 30 * clip((Math.log10(Math.max(medRecent, 1)) - 4.7) / (6.0 - 4.7), 0, 1);

  const consistency = 15 * s100 + 10 * clip(s1m / 0.25, 0, 1);

  if (s100 >= 0.6 && peak <= 15 && medRecent >= 150000) tags.push('Consistent engine');
  if (peak > 30 || (s100 < 0.2 && mx >= 1e6)) tags.push('One-hit');
  if (subs && subs < 25000 && medRecent >= 200000) tags.push('Tiny & huge');
  if (trend >= 1.4) tags.push('Rising'); else if (trend <= 0.6) tags.push('Fading');
  vids.forEach(v => { v.x = r1(v.v / Math.max(medAll, 1000)); });

}

  en: 'the a an and of to in is it you your for with this that what if can how why who when are was be but not on at from i my we they he she his her one all will would could just do did so out up about into than then there their them our over',
  es: 'el la los las un una y de del que en es por con para su sus como pero se lo al muy más mi tu qué cómo cuando porque este esta eso son era fue hay si ya',
  pt: 'o os as um uma e do da dos das que em é por com para seu sua como mas se não muito mais meu você porque este esta isso são foi tem na no nos nas ele ela eu',
  id: 'yang dan di ke dari ini itu untuk dengan pada adalah tidak ada akan juga saya kamu dia mereka kami apa bagaimana kenapa kalau bisa lebih sangat sudah belum atau karena fakta',
  tr: 've bir bu için ile çok de da ne gibi ama daha en mi var yok ben sen biz siz',
  fr: 'le la les un une et du des que est pour avec sur dans pas ce cette il elle je tu nous vous qui mais plus très',
  de: 'der die das und ist zu den mit für auf nicht ein eine er sie ich du wir von dem auch aber wie was',
  it: 'il lo gli le un una e di del della che è per con su non si come ma più molto anche'
}).map(([k, v]) => [k, new Set(v.split(' '))]));
function detectLang(texts) {
  const text = texts.filter(Boolean).join(' ').replace(/#\w+|https?:\/\/\S+/g, ' ');
  const letters = [...text].filter(c => /\p{L}/u.test(c)).length;
  if (!letters) return 'und';
  const counts = SCRIPTS.map(([code, rx]) => [code, (text.match(rx) || []).length]);
  if ((counts.find(c => c[0] === 'ja') || [0, 0])[1] >= 0.1 * letters) return 'ja';
  const top = counts.reduce((a, b) => (b[1] > a[1] ? b : a));
  if (top[1] >= 0.3 * letters) return top[0];
  const words = text.toLowerCase().match(/[a-zà-ÿ']+/g) || [];
  let best = 'und', bs = 0;
  for (const [k, set] of Object.entries(STOP)) { const s = words.filter(w => set.has(w)).length; if (s > bs) { best = k; bs = s; } }
  return bs >= 2 ? best : 'und';
}
function parseDur(iso) {
  const m = /^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || '');
  return m ? (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0) : 1e6;
}
async function ytApi(path, params) {
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set('key', getKey());
  let r;
  try { r = await fetch(u.toString()); } catch (e) { throw {net: true}; }
  if (!r.ok) {
    let body = {}; try { body = await r.json(); } catch (e) {}
    if (r.status === 403 && /quota/i.test(JSON.stringify(body))) throw {quota: true};
    if (r.status === 400 || r.status === 403) throw {badKey: true};
    throw {http: r.status};
  }
  return r.json();
}
const parseVideo = it => ({
  id: it.id, t: (it.snippet || {}).title || '', ch: (it.snippet || {}).channelId,
  v: it.statistics && it.statistics.viewCount != null ? +it.statistics.viewCount : null,
  dur: parseDur(it.contentDetails && it.contentDetails.duration), p: (it.snippet || {}).publishedAt ? Date.parse(it.snippet.publishedAt) / 1000 : null
});
async function probeStatic(chId, info, query) {
  const pl = await ytApi('playlistItems', {part: 'contentDetails', playlistId: 'UU' + chId.slice(2), maxResults: 50});
  const ids = (pl.items || []).map(i => i.contentDetails && i.contentDetails.videoId).filter(Boolean);
  if (!ids.length) return null;
  const vr = await ytApi('videos', {part: 'snippet,statistics,contentDetails', id: ids.join(',')});
  const byId = new Map((vr.items || []).map(it => [it.id, parseVideo(it)]));
  const vids = ids.map(i => byId.get(i)).filter(v => v && v.v != null && v.dur <= 180).slice(0, 24)
    .map(v => ({id: v.id, t: v.t, v: v.v, ...(v.p ? {p: Math.round(v.p)} : {})}));
  const sn = (info && info.snippet) || {}, st = (info && info.statistics) || {}, th = sn.thumbnails || {};
  const subs = st.hiddenSubscriberCount ? 0 : +(st.subscriberCount || 0);
  const m = computeMetrics(vids, subs);
  if (!m) return null;
  const descr = (sn.description || '').replace(/\s+/g, ' ').trim().slice(0, 400);
  const lang = detectLang(vids.map(v => v.t).concat([descr]));
  return Object.assign({ch_id: chId, name: sn.title || chId, handle: sn.customUrl || '', subs, lang, english: lang === 'en' || lang === 'und',
    queries: [query], series: vids, watch: false, descr, avatar_url: (th.medium || th.default || {}).url || '', pick: null}, m);
}
async function staticSearch(query) {
  if (!getKey()) { openKeyDialog(); return; }
  if (S.tab !== 'search') PREV_TAB = S.tab;
  S.tab = 'search';
  const mine = SEARCH = {query, id: 'web', state: 'running', phase: 'searching', done: 0, total: 0, found: 0, channels: [], error: null, tracked: false, msg: ''};
  render(); window.scrollTo(0, 0);
  const paint = () => { if (S.tab === 'search' && SEARCH === mine) renderContent(); };
  try {
    const thai = /[฀-๿]/.test(query);
    const sr = await ytApi('search', Object.assign({part: 'id', type: 'video', order: 'viewCount', videoDuration: 'short', maxResults: 50, q: query,
      publishedAfter: new Date(Date.now() - 30 * 864e5).toISOString()}, thai ? {relevanceLanguage: 'th', regionCode: 'TH'} : {}));
    const ids = (sr.items || []).map(i => i.id && i.id.videoId).filter(Boolean);
    const vr = ids.length ? await ytApi('videos', {part: 'snippet,statistics,contentDetails', id: ids.join(',')}) : {items: []};
    const rows = (vr.items || []).map(parseVideo).filter(v => v.v != null && v.dur <= 180 && v.ch);
    mine.found = rows.length; mine.phase = 'checking';
    const best = new Map();
    rows.forEach(r => best.set(r.ch, Math.max(best.get(r.ch) || 0, r.v)));
    const chIds = [...best.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12).map(e => e[0]);
    mine.total = chIds.length; paint();
    const cr = chIds.length ? await ytApi('channels', {part: 'snippet,statistics', id: chIds.join(',')}) : {items: []};
    const info = new Map((cr.items || []).map(c => [c.id, c]));
    let next = 0;
    const worker = async () => {
      while (next < chIds.length) {
        const id = chIds[next++];
        try {
          const ch = await probeStatic(id, info.get(id), query);
          if (ch) { mine.channels.push(ch); mine.channels.sort((a, b) => b.score - a.score); }
        } catch (e) { if (e && (e.quota || e.badKey)) throw e; }
        mine.done++; paint();
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    mine.state = 'done';
  } catch (e) {
    mine.state = 'error';
    mine.msg = e && e.quota ? t('kQuota') : e && e.badKey ? t('kBad') : e && e.net ? t('kNet') : t('sErr');
  }
  if (S.tab === 'search' && SEARCH === mine) { renderChips(); renderContent(); }
}
function openKeyDialog() {
  const dlg = $('#dlg'), body = $('#dlgBody');
  body.onclick = null;
  body.innerHTML = `<h3>${esc(t('kTitle'))}</h3><p>${esc(t('kBody'))}</p>
    <div class="row"><input id="keyIn" type="password" autocomplete="off" spellcheck="false" placeholder="${esc(t('kPh'))}"><button class="pillbtn primary" id="keySave">${esc(t('kSave'))}</button></div>
    <p>${esc(t('kPrivacy'))}</p>
    <div style="text-align:right;margin-top:14px"><button class="pillbtn" id="dlgClose">${esc(t('dClose'))}</button></div>`;
  $('#keySave').onclick = () => { const v = $('#keyIn').value.trim(); if (!v) return; setKey(v); dlg.close(); if (S.q.trim().length >= 2) staticSearch(S.q.trim()); };
  $('#dlgClose').onclick = () => dlg.close();
  dlg.showModal();
}

/* ---------- data loop ---------- */
async function refresh() {
  if (!LIVE) return;
  try {
    const r = await fetch(STATIC ? 'data.json' : '/api/data', {cache: STATIC ? 'no-cache' : 'no-store'});
    DATA = await r.json();
    if (!$('#dlg').open) render(true); else renderStatus();
  } catch (e) {
    $('#status').innerHTML = `<span class="dot"></span><span>${esc(t('offline'))}</span>`;
  }
}
applyStaticText();
if (LIVE) { refresh().then(() => render()); setInterval(refresh, STATIC ? 60000 : 15000); } else { render(); }
