<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https://i.ytimg.com data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; frame-src https://www.youtube-nocookie.com">
<meta name="description" content="Find YouTube Shorts channels that are blowing up: small channels with huge views, viral videos and new uploads, in English and Thai.">
<title>Viral Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff0033'/%3E%3Cpath d='M16 5c1.3 4.6 7.5 7.4 7.5 14.5a7.5 7.5 0 0 1-15 0c0-4 2.5-6.4 3.8-7.6 0 2.6 1.1 4.1 2.6 4.1 0-3.9-1.1-7.6 1.1-11z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff; --bg2:#f9f9f9; --surface:#f2f2f2; --surface2:#e5e5e5; --text:#0f0f0f; --muted:#606060; --line:#e5e5e5;
  --on-bg:#0f0f0f; --on-fg:#ffffff; --accent:#065fd4; --red:#ff0033; --good:#188038; --warn:#b05a00; --bad:#d93025;
  --hover:rgba(0,0,0,.05); --card:#ffffff; --shadow:0 6px 28px rgba(0,0,0,.10);
  --hot3:#ff0033; --hot2:#f05a00; --hot1bg:#fff1d6; --hot1:#8a4b00; --tip:#fff8e1; --tipline:#f3d48a; --series-1:#2a78d6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f0f0f; --bg2:#151515; --surface:#272727; --surface2:#3f3f3f; --text:#f1f1f1; --muted:#aaaaaa; --line:#303030;
    --on-bg:#f1f1f1; --on-fg:#0f0f0f; --accent:#3ea6ff; --good:#4cc36f; --warn:#f2a33a; --bad:#ff6b61; --hover:rgba(255,255,255,.08);
    --card:#1c1c1c; --shadow:0 6px 28px rgba(0,0,0,.5); --hot1bg:#3a2a10; --hot1:#ffc66b; --tip:#2a2412; --tipline:#5c4b1d; --series-1:#3987e5;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Roboto,"Noto Sans Thai","Leelawadee UI","Segoe UI",Arial,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
html[lang=th] body{line-height:1.6}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- top bar ---- */
#top{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg)}
.icon{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon:hover{background:var(--hover)}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:19px;letter-spacing:-.04em;white-space:nowrap;padding:0 6px 0 2px}
.brand .logo{width:30px;height:22px;border-radius:7px;background:var(--red);display:grid;place-items:center}
.brand .logo svg{width:16px;height:16px;fill:#fff;stroke:none}
.search{flex:1 1 auto;max-width:600px;margin:0 auto;display:flex;min-width:0}
.search input{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid var(--line);border-right:0;border-radius:40px 0 0 40px;background:var(--bg);outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.search input:focus{border-color:var(--accent)}
.search button{width:64px;height:40px;border:1px solid var(--line);border-radius:0 40px 40px 0;background:var(--surface);display:grid;place-items:center}
.search button:hover{background:var(--surface2)}
.actions{display:flex;align-items:center;gap:6px}
.pillbtn{height:36px;border:0;border-radius:18px;padding:0 14px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.pillbtn:hover{background:var(--surface2)}
.pillbtn svg{width:20px;height:20px}
.pillbtn.primary{background:var(--on-bg);color:var(--on-fg)}
.pillbtn.primary:hover{opacity:.88}
.pillbtn.red{background:var(--red);color:#fff}
.pillbtn.red:hover{opacity:.9}
.pillbtn[disabled]{opacity:.6;cursor:default}
.pillbtn.big{height:44px;border-radius:22px;padding:0 22px;font-size:15px}
.seg{display:inline-flex;background:var(--surface);border-radius:18px;padding:3px;flex:none}
.seg button{border:0;background:transparent;height:30px;min-width:44px;padding:0 12px;border-radius:15px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg)}

/* ---- layout + sidebar ---- */
#layout{display:flex}
#side{position:sticky;top:56px;align-self:flex-start;height:calc(100vh - 56px);width:236px;flex:none;padding:4px 12px 16px;overflow-y:auto;scrollbar-width:thin}
.nav{display:flex;align-items:center;gap:22px;width:100%;height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px}
.nav:hover{background:var(--hover)}
.nav[aria-current=true]{background:var(--surface);font-weight:600}
.nav .n{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.navsep{border:0;border-top:1px solid var(--line);margin:8px 0}
#side .nav[data-tab=more]{display:none}
.nav .n.hot{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;line-height:18px;font-weight:600}
.sidesec{border-top:1px solid var(--line);margin:10px 0;padding-top:12px}
.sidesec h4{margin:0 12px 8px;font-size:14px;font-weight:600}
.sidesec p{margin:8px 12px 0;color:var(--muted);font-size:12px;line-height:1.5}
.sidesec .seg{margin:0 12px}
.livebox{display:flex;gap:8px;align-items:flex-start;margin:0 12px;color:var(--muted);font-size:12px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:5px}
.dot.live{background:var(--good);animation:pulse 1.8s infinite}
.dot.snap{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sidefoot{margin:12px;color:var(--muted);font-size:11px;line-height:1.5}
body.mini #side{width:76px;padding:4px}
body.mini .nav{flex-direction:column;gap:4px;height:68px;justify-content:center;padding:0;font-size:10px;text-align:center}
body.mini .nav .n,body.mini .sidesec,body.mini .sidefoot{display:none}
main{flex:1;min-width:0;padding:0 24px 48px}

/* ---- topic chips + filters ---- */
#chips{position:sticky;top:56px;z-index:30;background:var(--bg);display:flex;gap:10px;align-items:center;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none}
#chips:empty{display:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;border:0;border-radius:8px;padding:0 12px;background:var(--surface);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg)}
.chip.x::after{content:"✕";font-size:11px;opacity:.75}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 14px}
.filters select{height:34px;border:1px solid var(--line);border-radius:18px;padding:0 10px;background:var(--bg);max-width:100%}
.filters select:hover{background:var(--hover)}
.filters .chip{height:34px;border-radius:18px}
.phead{margin:6px 0 10px}
.phead h1{margin:0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.phead p{margin:4px 0 0;color:var(--muted);max-width:860px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--surface);margin:0 0 14px}

/* ---- avatars, pills ---- */
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;color:#fff;flex:none;font-weight:600}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vd{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:0 9px;font-size:12px;line-height:22px;font-weight:600;white-space:nowrap;border:0}
.vd.v3{background:var(--hot3);color:#fff}
.vd.v2{background:var(--hot2);color:#fff}
.vd.v1{background:var(--hot1bg);color:var(--hot1)}
.vd.v0{background:var(--surface);color:var(--muted);font-weight:500}
.tag,.lang{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 9px;font-size:12px;line-height:22px;background:var(--surface);color:var(--muted);white-space:nowrap;border:0}
.tag.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tag.pick{background:var(--on-bg);color:var(--on-fg);font-weight:600}
.tag.new{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);font-weight:600}
button.tag,button.vd{cursor:help}
.tr{color:var(--accent);font-size:12px;white-space:nowrap;font-weight:500}
.tr:hover{text-decoration:underline}
.qm{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:11px;line-height:16px;font-weight:700;padding:0;display:inline-grid;place-items:center;vertical-align:middle;flex:none}
.qm:hover{background:var(--surface);color:var(--text)}

/* ---- home ---- */
.hero{position:relative;display:flex;gap:22px;align-items:center;padding:22px 24px;margin:4px 0 18px;border-radius:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--red) 13%,var(--bg)),color-mix(in srgb,#ffb000 15%,var(--bg)))}
.hero .emo{font-size:46px;line-height:1}
.hero h2{margin:0 0 6px;font-size:22px;line-height:1.3;padding-right:30px}
.hero p{margin:0 0 14px;max-width:720px}
.hero .btns{display:flex;gap:8px;flex-wrap:wrap}
.hero .closex{position:absolute;right:10px;top:10px}
.sumline{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;color:var(--muted);margin:0 0 6px;font-size:13px}
.sumline b{color:var(--text);font-weight:600}
.shelfsec{margin:12px 0 28px}
.shhead{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px}
.shhead h2{margin:0;font-size:20px;line-height:1.3;font-weight:700}
.shhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.shhead .shnav{margin-left:auto;display:flex;gap:4px;align-items:center;flex:none}
.seeall{border:0;background:transparent;color:var(--accent);font-weight:600;height:36px;padding:0 12px;border-radius:18px;white-space:nowrap}
.seeall:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px 2px 8px;scroll-behavior:smooth}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.rail .vcard{flex:0 0 190px}
.rail .ccard{flex:0 0 220px}
.rail .pcard{flex:0 0 340px}

/* ---- cards ---- */
.th{position:relative;display:block;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--surface)}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
a.th:hover img{transform:scale(1.03)}
.th::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
.th .views{position:absolute;left:8px;bottom:8px;z-index:1;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.th .dur{position:absolute;right:8px;bottom:8px;z-index:1;background:rgba(0,0,0,.8);color:#fff;border-radius:4px;padding:0 4px;font-size:12px;font-weight:600;line-height:18px}
.th .x{position:absolute;left:8px;top:8px;z-index:1;background:rgba(0,0,0,.72);color:#fff;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;line-height:21px}
.th .x.mid{background:var(--hot2)}
.th .x.hi{background:var(--hot3)}
.th .g{position:absolute;right:8px;top:8px;z-index:1;background:#065fd4;color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;line-height:19px}
.th .play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:opacity .2s;z-index:1}
.th .play svg{fill:#fff;stroke:none;width:22px;height:22px;margin-left:3px}
a.th:hover .play{opacity:1}
.vmeta{display:flex;gap:10px;margin-top:10px}
.vtxt{min-width:0;flex:1}
.vt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:14px;line-height:1.45}
.vch{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.vch button,.avlink{border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left}
.vch button:hover{color:var(--text)}
.avlink{border-radius:50%;height:max-content}
.vst{color:var(--muted);font-size:12px}
.vst .hotx{color:var(--hot2);font-weight:600}
.vst.when{color:var(--accent)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px 14px;padding-top:4px}
.ccard,.pcard{border:0;text-align:left;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line);padding:0;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.ccard:hover,.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;aspect-ratio:16/9.5;background:var(--surface);overflow:hidden;width:100%}
.trio img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .cbody{padding:0 14px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;width:100%}
.ccard .cbody .av{margin-top:-32px;box-shadow:0 0 0 3px var(--card)}
.ccard b{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ccard small{color:var(--muted);font-size:12px;line-height:1.45}
.pcard .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.pcard .ptop{display:flex;gap:10px;align-items:center}
.pcard .ptop b{font-size:15px;line-height:1.3;display:block}
.pcard .pnote{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---- channel rows ---- */
.ch{padding:18px 0 14px;border-bottom:1px solid var(--line)}
.chhead{display:flex;gap:20px;align-items:flex-start}
.chinfo{flex:1;min-width:0}
.chname{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chname>button:first-child{border:0;background:none;padding:0;font-size:18px;line-height:1.35;font-weight:600;text-align:left}
.chname>button:first-child:hover{text-decoration:underline}
.chsub{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.why{margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--tip);border:1px solid var(--tipline);max-width:820px;font-size:13.5px}
.why div+div{margin-top:3px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.st{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border-radius:10px;padding:5px 10px;font-size:13px}
.st b{font-variant-numeric:tabular-nums;font-weight:700}
.st span{color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:none;min-width:124px}
.ring{--p:0;--c:var(--muted);width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;align-self:center}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.savebtn{height:36px;border:0;border-radius:18px;padding:0 16px;background:var(--on-bg);color:var(--on-fg);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.savebtn svg{width:18px;height:18px}
.savebtn.on{background:var(--surface);color:var(--text)}
.ghost{height:36px;border:0;border-radius:18px;padding:0 14px;background:transparent;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ghost:hover{background:var(--hover)}
.ghost svg{width:18px;height:18px}
.note{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);max-width:900px;font-size:13.5px}
.note b{display:block;margin-bottom:2px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:14px 0 6px;scroll-snap-type:x proximity;scrollbar-width:thin}
.short{flex:0 0 150px;scroll-snap-align:start}
.short .t{margin-top:8px;font-size:13.5px;line-height:1.45;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- topics ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-top:4px}
.tile{border:0;text-align:left;border-radius:16px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px;transition:background .15s}
.tile:hover{background:var(--surface2)}
.tile .em{font-size:30px;line-height:1}
.tile b{font-size:17px;line-height:1.3}
.tile small{color:var(--muted);font-size:12.5px}
.stack{display:flex}
.stack .av{box-shadow:0 0 0 2px var(--surface)}
.stack .av+.av{margin-left:-10px}
.tile .bar2{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.tile .bar2 i{display:block;height:100%;background:var(--red);border-radius:99px}
.subhead{margin:30px 0 4px;font-size:17px}

/* ---- help ---- */
.help{max-width:880px}
.hsec{background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:16px;padding:18px 22px;margin:0 0 14px;scroll-margin-top:70px}
.hsec h2{margin:0 0 8px;font-size:19px;line-height:1.35;display:flex;gap:10px;align-items:center}
.hsec h2 .em{font-size:24px}
.hsec p{margin:0 0 8px}
.hsec ol,.hsec ul{margin:4px 0 8px;padding-left:22px}
.hsec li{margin:6px 0}
.gl{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:12px 18px;margin:6px 0 0}
.gl dt{font-weight:600;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.gl dd{margin:0;color:var(--muted)}
.qa summary{cursor:pointer;font-weight:600;padding:8px 0}
.qa p{margin:0 0 10px;color:var(--muted)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}

/* ---- misc ---- */
.empty{padding:56px 16px;text-align:center;color:var(--muted)}
.empty .em{font-size:40px;display:block;margin-bottom:8px}
.more{display:block;margin:18px auto;height:38px;border:0;border-radius:19px;padding:0 22px;background:var(--surface);font-weight:600}
.more:hover{background:var(--surface2)}
footer{margin-top:32px;color:var(--muted);font-size:12px;max-width:860px;line-height:1.6}
#pop{position:fixed;z-index:90;max-width:300px;padding:10px 12px;border-radius:10px;background:var(--on-bg);color:var(--on-fg);font-size:13px;line-height:1.5;box-shadow:var(--shadow);display:none}
#pop b{display:block;margin-bottom:2px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:100;background:var(--on-bg);color:var(--on-fg);padding:10px 18px;border-radius:10px;font-weight:500;transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- dialogs ---- */
dialog{border:0;background:var(--bg);color:var(--text);border-radius:18px;padding:0;width:min(680px,94vw);max-height:90vh;box-shadow:0 16px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{position:relative;padding:22px 24px;overflow:auto;max-height:90vh}
.dlg h3{margin:0 0 6px;font-size:19px}
.dlg p{margin:0 0 8px;color:var(--muted)}
.dlg ol{margin:6px 0 12px;padding-left:22px}
.dlg li{margin:4px 0}
.dlg a.link{color:var(--accent);font-weight:500}
.row{display:flex;gap:8px;margin:10px 0 14px}
.row input{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
.row input:focus{border-color:var(--accent)}
.qlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.q{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border-radius:8px;padding:0 4px 0 10px;line-height:28px;font-size:13px}
.q.dead{opacity:.5}
.q small{color:var(--muted)}
.q button{border:0;background:transparent;color:var(--muted);padding:0 6px;font-size:15px}
pre.log{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:12px;max-height:160px;overflow:auto;white-space:pre-wrap;margin:6px 0 0}
.dlgclose{position:absolute;right:12px;top:12px;z-index:2;background:var(--bg)}
#sheet{width:min(1040px,96vw)}
#sheet .dlg{padding:0}
.shtop{padding:26px 64px 18px 28px;display:flex;gap:22px;align-items:center;background:linear-gradient(180deg,var(--surface),var(--bg))}
.shtop h2{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.01em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shtop .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.shbody{padding:4px 28px 26px}
.cards4{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:14px 0}
.scard{background:var(--surface);border-radius:12px;padding:12px 14px}
.scard .lbl{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.scard b{display:block;font-size:22px;line-height:1.3;margin-top:2px;font-variant-numeric:tabular-nums}
.scard small{color:var(--muted);font-size:12px;display:block;line-height:1.4}
.shbody h3{margin:22px 0 8px;font-size:17px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.descr{color:var(--muted);font-size:13px;max-width:860px}
.taglist{display:flex;flex-direction:column;gap:8px}
.taglist div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.taglist small{color:var(--muted);font-size:13px}
#player{width:fit-content;max-width:96vw;background:#0f0f0f;color:#f1f1f1}
#player .pwrap{position:relative;display:flex;max-height:90vh}
#player .pvid{height:min(84vh,780px);aspect-ratio:9/16;background:#000;flex:none}
#player iframe{width:100%;height:100%;border:0;display:block}
#player .pside{width:340px;padding:22px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
#player .pside h3{margin:0;font-size:17px;line-height:1.4;padding-right:34px}
#player .pfacts{display:flex;flex-direction:column;gap:8px;font-size:14px}
#player .pfacts div{display:flex;gap:10px}
#player .pfacts .em{width:22px;text-align:center;flex:none}
#player .pch{display:flex;gap:10px;align-items:center;border:0;background:#272727;color:#f1f1f1;border-radius:12px;padding:10px;text-align:left}
#player .pch:hover{background:#3a3a3a}
#player .pch small{display:block;color:#aaa;font-size:12px}
#player .pillbtn{background:#272727;color:#f1f1f1}
#player .pillbtn:hover{background:#3f3f3f}
#player .pillbtn.red{background:var(--red);color:#fff}
#player .hint{color:#aaa;font-size:12px}
#player .dlgclose{background:#272727;color:#fff}
#player .btns{display:flex;gap:8px;flex-wrap:wrap}
.welcome{text-align:center;padding:30px 28px 26px}
.welcome .emo{font-size:52px;line-height:1}
.welcome h3{font-size:24px;margin:10px 0 6px}
.welcome .langs{display:flex;gap:10px;justify-content:center;margin:14px 0 18px}
.welcome .langs button{min-width:130px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:17px;font-weight:600}
.welcome .langs button[aria-pressed=true]{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--bg))}
.welcome ul{list-style:none;padding:0;margin:0 auto 20px;max-width:480px;text-align:left;display:flex;flex-direction:column;gap:10px}
.welcome li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:12px;padding:10px 14px}
.welcome li .em{font-size:20px}
.welcome .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}


/* ---- this week ---- */
.wkhead{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px 16px}
.rk{display:flex;align-items:center}
.rk .num{flex:none;font-size:92px;line-height:.8;font-weight:900;letter-spacing:-.08em;color:var(--bg);-webkit-text-stroke:3px var(--text);margin-right:-18px;z-index:1;pointer-events:none;font-family:Arial,sans-serif}
.rk .vcard{flex:1;min-width:0}
.rlist{display:flex;flex-direction:column;gap:6px;max-width:920px}
.rrow{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:var(--surface);cursor:pointer}
.rrow:hover{background:var(--surface2)}
.rrow .n{font-size:22px;font-weight:800;width:30px;text-align:center;color:var(--muted);flex:none}
.rrow .n.top{color:var(--red)}
.rrow .meta{flex:1;min-width:0}
.rrow .meta b{display:block;font-size:15px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .meta small{color:var(--muted);font-size:12.5px}
.rrow .gain{font-weight:700;white-space:nowrap}

/* ---- idea lab ---- */
.recipe{padding:18px 20px;border-radius:16px;background:linear-gradient(120deg,color-mix(in srgb,#ffb000 16%,var(--bg)),color-mix(in srgb,var(--red) 10%,var(--bg)));margin:0 0 16px}
.recipe h2{margin:0 0 10px;font-size:19px}
.recipe .chips2{display:flex;flex-wrap:wrap;gap:8px}
.recipe .chips2 span{background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.recipe p{margin:10px 0 0;color:var(--muted);font-size:12.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:18px}
.pbox{background:var(--surface);border-radius:14px;padding:14px 16px}
.pbox h4{margin:0 0 10px;font-size:14.5px}
.pbox p{margin:0;color:var(--muted);font-size:12.5px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:74px 1fr 44px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.bar i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--series-1);min-width:2px}
.bar i.o{background:color-mix(in srgb,var(--muted) 45%,transparent)}
.bar b{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.wcloud{display:flex;flex-wrap:wrap;gap:6px}
.wcloud span{background:var(--surface);border-radius:8px;padding:3px 9px;font-weight:600}
.wcloud span small{color:var(--muted);font-weight:400;margin-left:4px}

/* ---- compare ---- */
#tray{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:44;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-radius:999px;background:var(--on-bg);color:var(--on-fg);box-shadow:var(--shadow);max-width:94vw}
#tray:empty{display:none}
#tray .stack .av{box-shadow:0 0 0 2px var(--on-bg)}
#tray .stack .av+.av{margin-left:-8px}
#tray .go{background:var(--red);color:#fff;border:0;border-radius:999px;height:34px;padding:0 14px;font-weight:600;white-space:nowrap}
#tray .x{background:transparent;border:0;color:inherit;opacity:.75;width:30px;height:30px;border-radius:50%}
.cmpwrap{overflow-x:auto;margin-top:6px;border-top:1px solid var(--line)}
.cmp{display:grid;min-width:max-content}
.cmp>div{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-width:180px}
.cmp .lbl{color:var(--muted);font-size:13px;position:sticky;left:0;background:var(--bg);z-index:1;min-width:136px;max-width:160px}
.cmp .hd{flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative}
.cmp .hd .x{position:absolute;right:4px;top:4px;width:28px;height:28px}
.cmp .hd button.name{border:0;background:none;padding:0;font-weight:600;font-size:15px}
.cmp .hd button.name:hover{text-decoration:underline}
.cmp .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.cmp .best{background:color-mix(in srgb,#ffb000 13%,transparent)}
.cmp .thumbs{display:flex;gap:4px}
.cmp .thumbs a{width:48px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:var(--surface);display:block}
.cmp .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.spark{width:140px;height:36px;stroke:none;fill:none;display:block}

/* ---- growth charts ---- */
.charts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chartbox{background:var(--surface);border-radius:12px;padding:12px 14px 10px}
.chartbox h4{margin:0;font-size:12.5px;color:var(--muted);font-weight:500}
.chartbox .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.chartbox .delta{font-size:12.5px;font-weight:600;margin-left:6px;color:var(--muted)}
.chartbox .delta.up{color:var(--good)}
.lchart{position:relative;width:100%;height:140px;margin-top:6px;touch-action:pan-y}
.lchart svg{display:block;width:100%;height:100%;stroke:none;fill:none;overflow:visible}
.lchart .ln,.spark .ln{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lchart .gl{stroke:var(--line);stroke-width:1}
.lchart .dt,.spark .dt,.lchart .hd{fill:var(--series-1);stroke:var(--surface);stroke-width:2}
.lchart .lb{fill:var(--text);font-size:12px;font-weight:600}
.lchart .ax{fill:var(--muted);font-size:11px}
.lchart .xh{stroke:var(--muted);stroke-width:1}
.lchart .tip{position:absolute;pointer-events:none;background:var(--on-bg);color:var(--on-fg);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));display:none;z-index:2}
.ctbl{margin-top:8px;font-size:12.5px;color:var(--muted)}
.ctbl summary{cursor:pointer}
.tbl{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:4px 10px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
.tbl th:first-child,.tbl td:first-child{text-align:left}

/* ---- help (simple) ---- */
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:4px 0 22px;max-width:920px}
.hcard{border:0;text-align:left;border-radius:18px;padding:0;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.hcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hcard .poster{position:relative;aspect-ratio:16/9;background:#111;display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.hcard .poster img{width:100%;height:100%;object-fit:cover;opacity:.75}
.hcard .poster .pl{position:absolute;inset:0;margin:auto;width:68px;height:48px;border-radius:14px;background:var(--red);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.hcard .poster .pl svg{fill:#fff;stroke:none;width:26px;height:26px;margin-left:3px}
.hcard .poster .tag2{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.8);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.hcard .poster.tourp{display:grid;place-items:center;grid-template-columns:1fr;background:linear-gradient(120deg,#ff0033,#ff8a00)}
.hcard .poster.tourp span{font-size:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
.hcard .hb{padding:14px 16px 16px}
.hcard .hb b{display:block;font-size:17px;margin-bottom:4px}
.hcard .hb small{color:var(--muted);font-size:13px;line-height:1.5}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 24px;max-width:920px}
.three div{background:var(--surface);border-radius:16px;padding:16px}
.three .vis{font-size:26px;font-weight:800;margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:34px}
.three b{display:block;font-size:16px;margin-bottom:4px}
.three small{color:var(--muted);font-size:13px;line-height:1.5}
.acc{max-width:920px}
.acc details{background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:14px;margin:0 0 10px;padding:0 18px}
.acc details>summary{cursor:pointer;font-weight:600;font-size:16px;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.acc details>summary::-webkit-details-marker{display:none}
.acc details>summary::after{content:"＋";color:var(--muted)}
.acc details[open]>summary::after{content:"－"}
.acc details>div{padding:0 0 14px}
.acc ol{margin:0 0 6px;padding-left:22px}
.acc li{margin:6px 0}

/* ---- video-style intro ---- */
#intro{background:#0b0b0b;color:#fff;width:fit-content;max-width:96vw;border-radius:22px}
#intro .iv{width:min(460px,94vw);display:flex;flex-direction:column;align-items:center;position:relative}
#intro .ihead{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px 8px}
#intro .ihead b{flex:1;font-size:15px}
#intro .frame{position:relative;height:min(68vh,640px);aspect-ratio:9/16;overflow:hidden;border-radius:16px;background:#0f0f0f;box-shadow:0 0 0 1px #262626}
#intro .stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;overflow:hidden;background:radial-gradient(circle at 50% 28%,#3a0f18,#0f0f0f 68%);color:#f1f1f1;font-size:15px;line-height:1.4}
#intro .icap{min-height:66px;padding:12px 18px 4px;font-size:16px;line-height:1.45;text-align:center;font-weight:600;width:100%;transition:opacity .3s}
#intro .ibar{display:flex;align-items:center;gap:8px;width:100%;padding:6px 14px 14px}
#intro .ibar button,#intro .ihead button{background:#272727;border:0;color:#fff;border-radius:999px;height:34px;min-width:34px;padding:0 11px;font-weight:600;display:inline-grid;place-items:center}
#intro .ibar button:hover,#intro .ihead button:hover{background:#3a3a3a}
#intro .ibar svg{width:18px;height:18px}
#intro .iprog{flex:1;height:6px;background:#3a3a3a;border-radius:3px;position:relative;cursor:pointer}
#intro .iprog i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:3px}
#intro .iprog b{position:absolute;top:-2px;width:2px;height:10px;background:#666;border-radius:1px}
#intro .itime{font-size:12px;color:#aaa;font-variant-numeric:tabular-nums;min-width:76px;text-align:right}
.stage .sc{position:absolute;inset:0;animation:scin .45s ease both}
@keyframes scin{from{opacity:0}to{opacity:1}}
.stage .pop{transform:scale(.3);opacity:0;transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .35s}
.stage .up{transform:translateY(26px);opacity:0;transition:transform .5s ease,opacity .5s ease}
.stage .on{transform:none;opacity:1}
.stage .center{position:absolute;left:0;right:0;text-align:center}
.stage .logo{position:absolute;left:130px;top:150px;width:100px;height:74px;border-radius:22px;background:#ff0033;display:grid;place-items:center;box-shadow:0 10px 40px rgba(255,0,51,.45)}
.stage .logo svg{width:44px;height:44px;fill:#fff;stroke:none}
.stage .rings{position:absolute;left:180px;top:187px}
.stage .rings i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,0,51,.6);animation:ring 2.4s infinite}
.stage .rings i:nth-child(2){animation-delay:.8s}
.stage .rings i:nth-child(3){animation-delay:1.6s}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
.stage .ttl{top:262px;font-size:34px;font-weight:800;letter-spacing:-.03em}
.stage .cnt{top:318px;font-size:15px;color:#ccc}
.stage .cnt b{color:#fff;font-size:18px}
.stage .card2{position:absolute;left:30px;right:30px;top:70px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:19px;font-weight:700}
.stage .fact{position:absolute;left:30px;right:30px;text-align:center;font-size:18px;background:#1f1f1f;border-radius:16px;padding:12px}
.stage .fact b{font-size:24px}
.stage .fact.big{background:#2a1a00;color:#ffd27a}
.stage .fact.big b{font-size:30px;color:#fff}
.stage .arrow{position:absolute;left:0;right:0;text-align:center;font-size:30px;color:#aaa}
.stage .boom{position:absolute;left:90px;width:180px;text-align:center;top:470px;font-size:58px;font-weight:900;color:#fff;background:#ff0033;border-radius:20px;padding:4px 0;box-shadow:0 10px 50px rgba(255,0,51,.6)}
.stage .lvl{position:absolute;left:26px;right:26px;display:flex;align-items:center;gap:10px;background:#1c1c1c;border-radius:14px;padding:12px 14px;font-size:14px;color:#ccc}
.stage .lvl .vd{font-size:13px;line-height:26px}
.stage .lvl.glow{box-shadow:0 0 0 2px #ff0033,0 0 30px rgba(255,0,51,.5)}
.stage .mhead{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0f0f0f}
.stage .mlogo{width:26px;height:19px;border-radius:6px;background:#ff0033;display:grid;place-items:center}
.stage .mlogo svg{width:13px;height:13px;fill:#fff;stroke:none}
.stage .mhead b{font-size:15px;letter-spacing:-.03em}
.stage .mseg{margin-left:auto;display:flex;background:#272727;border-radius:14px;padding:2px;font-size:12px}
.stage .mseg span{padding:3px 9px;border-radius:12px;color:#aaa}
.stage .mseg span.a{background:#f1f1f1;color:#0f0f0f}
.stage .mchips{position:absolute;left:12px;right:0;top:58px;display:flex;gap:7px;overflow:hidden;white-space:nowrap}
.stage .mchips span{background:#272727;border-radius:8px;padding:5px 10px;font-size:12.5px;transition:background .3s,color .3s}
.stage .mchips span.a{background:#f1f1f1;color:#0f0f0f}
.stage .mtitle{position:absolute;left:12px;right:12px;top:104px;font-size:16px;font-weight:700}
.stage .mrow{position:absolute;left:12px;right:12px;top:136px;display:flex;gap:8px}
.stage .mth{position:relative;flex:1;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#222}
.stage .mth img{width:100%;height:100%;object-fit:cover;display:block}
.stage .mth .x{position:absolute;left:5px;top:5px;background:#ff0033;color:#fff;border-radius:5px;padding:0 5px;font-size:11px;font-weight:700}
.stage .mth .vw{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.stage .mplayer{position:absolute;left:0;top:0;width:360px;height:640px;background:#000;transform-origin:0 0;transition:transform .5s cubic-bezier(.3,1,.4,1),opacity .3s;opacity:0}
.stage .mplayer.on{opacity:1}
.stage .mplayer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.stage .mplayer .pp{position:absolute;left:150px;top:290px;width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center}
.stage .mplayer .pp svg{fill:#fff;stroke:none;width:26px;height:26px;margin-left:4px}
.stage .mplayer .fp{position:absolute;left:20px;right:20px;bottom:60px;background:rgba(15,15,15,.92);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600}
.stage .mrowch{position:absolute;left:12px;right:12px;top:104px;display:flex;align-items:center;gap:10px;background:#1c1c1c;border-radius:14px;padding:10px}
.stage .mrowch b{font-size:16px}
.stage .msheet{position:absolute;left:0;right:0;top:640px;height:600px;background:#181818;border-radius:20px 20px 0 0;padding:20px 16px;transition:top .55s cubic-bezier(.3,1,.4,1);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.stage .msheet.on{top:80px}
.stage .msheet .top{display:flex;align-items:center;gap:12px}
.stage .msheet .top b{font-size:20px;display:block}
.stage .mwhy{margin-top:16px;background:#2a2412;border:1px solid #5c4b1d;border-radius:12px;padding:12px;font-size:14.5px;min-height:96px}
.stage .mwhy h5{margin:0 0 6px;font-size:14px}
.stage .mcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stage .mcards div{background:#272727;border-radius:10px;padding:10px;font-size:12px;color:#aaa}
.stage .mcards b{display:block;color:#fff;font-size:20px}
.stage .msave{margin-top:14px;display:inline-flex;align-items:center;gap:6px;background:#f1f1f1;color:#0f0f0f;border-radius:18px;padding:8px 18px;font-weight:700;transition:background .2s,color .2s}
.stage .msave.done{background:#272727;color:#fff}
.stage .mtoast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:#f1f1f1;color:#0f0f0f;border-radius:10px;padding:10px 16px;font-weight:600;opacity:0;transition:all .3s;white-space:nowrap;font-size:14px}
.stage .mtoast.on{opacity:1;transform:translateX(-50%)}
.stage .heart{position:absolute;font-size:22px;animation:float 1.2s ease-out forwards;pointer-events:none}
@keyframes float{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),-90px) scale(1.3);opacity:0}}
.stage .vcur{position:absolute;left:400px;top:700px;width:38px;height:38px;z-index:30;pointer-events:none;transition:left .8s cubic-bezier(.5,0,.2,1),top .8s cubic-bezier(.5,0,.2,1)}
.stage .vcur svg{width:38px;height:38px;fill:#fff;stroke:#000;stroke-width:1.2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.stage .vcur i{position:absolute;left:-8px;top:-8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);opacity:0}
.stage .vcur.tap i{animation:tap .55s ease-out}
@keyframes tap{0%{transform:scale(0);opacity:1}100%{transform:scale(2.2);opacity:0}}
.stage .end{position:absolute;left:24px;right:24px;top:150px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.stage .end .emo2{font-size:70px}
.stage .end h3{margin:0;font-size:26px}
.stage .end button{width:100%;height:50px;border-radius:25px;border:0;font-size:16px;font-weight:700}
.stage .end .b1{background:#ff0033;color:#fff}
.stage .end .b2{background:#272727;color:#fff}

/* ---- guided tour ---- */
#tour{position:fixed;inset:0;z-index:96;pointer-events:none}
#tour .hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.62),0 0 0 3px #ff0033;transition:all .35s cubic-bezier(.3,1,.4,1);pointer-events:none}
#tour .hole.none{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;box-shadow:none;background:rgba(0,0,0,.62)}
#tour .hole.pulse::after{content:"";position:absolute;inset:-3px;border-radius:16px;box-shadow:0 0 0 3px #ff0033;animation:hp 1.4s infinite}
@keyframes hp{from{transform:scale(1);opacity:1}to{transform:scale(1.08);opacity:0}}
#tour .bub{position:fixed;width:min(320px,calc(100vw - 24px));background:var(--bg);color:var(--text);border-radius:16px;padding:16px 16px 12px;box-shadow:0 12px 40px rgba(0,0,0,.45);pointer-events:auto;transition:left .3s,top .3s}
#tour .bub p{padding-right:26px;margin:0 0 6px;font-size:15.5px;line-height:1.5;font-weight:500}
#tour .bub .try{color:var(--red);font-weight:700;font-size:13px;margin:0 0 6px}
#tour .bub .row2{display:flex;align-items:center;gap:8px;margin-top:10px}
#tour .bub .row2 small{color:var(--muted);margin-right:auto}
#tour .bub button{height:34px;border-radius:17px;border:0;padding:0 14px;font-weight:600;background:var(--surface);color:var(--text)}
#tour .bub button.nx{background:var(--red);color:#fff}
#tour .bub .sk{position:absolute;right:8px;top:8px;width:30px;height:30px;padding:0;background:transparent;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.stage *,#tour .hole,#tour .bub{animation:none!important;transition:none!important}.confetti{display:none}}
.confetti{position:fixed;top:-20px;z-index:99;font-size:22px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:1180px){.pillbtn .lbl{display:none}.pillbtn{padding:0 10px}}

async function api(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Radar': '1'}, body: JSON.stringify(body || {})});
  return r.json().catch(() => ({}));
}

/* ---------- plain-language facts about a channel ---------- */
const VKEY = ['vNormal', 'vWatch', 'vHot', 'vSuper'];
const verdict = c => (c.score >= 80 ? 3 : c.score >= 65 ? 2 : c.score >= 50 ? 1 : 0);
const fire = l => '🔥'.repeat(l);
function vdPill(c) {
  const l = verdict(c);
  return `<button type="button" class="vd v${l}" data-help="verdict">${esc((l ? fire(l) + ' ' : '') + t(VKEY[l]) + (S.detail ? ' · ' + Math.round(c.score) : ''))}</button>`;
}
const factCache = new WeakMap();
function chFacts(c) {
  let f = factCache.get(c);
  if (f) return f;
  const ps = c.series.map(v => v.p).filter(Boolean).sort((a, b) => b - a);
  f = {freq: null, last: ps[0] || null, isNew: false, days: null};
  if (ps.length >= 3) f.freq = (ps.length - 1) / Math.max((ps[0] - ps[ps.length - 1]) / 86400, 0.5);   // uploads per day
  if (ps.length >= 3 && ps.length === c.series.length && c.series.length < 20) {
    f.days = Math.max(1, Math.ceil((nowTs() - ps[ps.length - 1]) / 86400));
    f.isNew = f.days <= 60;
  }
  factCache.set(c, f);
  return f;
}
function freqText(perDay) {
  if (perDay >= 1) return t('freqDay', {n: Math.round(perDay)});
  if (perDay * 7 >= 1) return t('freqWeek', {n: Math.round(perDay * 7)});
  return t('freqEvery', {n: Math.round(1 / perDay)});
}
function whyLines(c) {
  const out = [], n = c.series.length, r = c.ratio;
  if (c.subs > 0 && r >= 10) out.push(t('wRatioBig', {subs: fmt(c.subs), med: fmt(c.med_recent), r: fmtX(r)}));
  else if (c.subs > 0 && r >= 2) out.push(t('wRatio', {subs: fmt(c.subs), med: fmt(c.med_recent), r: fmtX(r)}));
  else out.push(t('wTypical', {med: fmt(c.med_recent)}));
  const k1 = c.series.filter(v => v.v >= 1e6).length, k100 = c.series.filter(v => v.v >= 1e5).length;
  if (k1 >= 2) out.push(t('wHits', {k: k1, n}));
  else if (k100 >= Math.max(3, n / 2)) out.push(t('wHits100', {k: k100, n}));
  const f = chFacts(c);
  if (f.isNew) out.push(t('wNew', {n, d: f.days}));
  if (c.tags.includes('Rising')) out.push(t('wRising', {r: fmtX(c.trend)}));
  else if (c.tags.includes('Fading')) out.push(t('wFading'));
  if (c.tags.includes('One-hit')) out.push(t('wOneHit'));
  return out;
}
const xText = x => (x >= 1.5 ? t('xMore', {x: fmtX(x)}) : x >= 0.8 ? t('xAbout') : t('xLess'));
const HELPKEYS = {subs: ['lSubs', 'gSubs'], typical: ['lTypical', 'gTypical'], best: ['lBest', 'gBest'], ratio: ['lRatio', 'gRatio'], x: ['lX', 'gX'],
  hits: ['lHits', 'gHits'], grow: ['lGrow', 'gGrow'], new: ['lNew', 'gNew'], score: ['lScore', 'gScore'], trend: ['lTrend', 'gTrend'], freq: ['lFreq', 'gFreq']};
function helpHtml(key) {
  if (key === 'verdict') return `<b>${esc(t('lVerdict'))}</b>${esc(t('gVerdict'))}` +
    [3, 2, 1, 0].map(l => `<div style="margin-top:4px">${l ? fire(l) : '•'} <b style="display:inline">${esc(t(VKEY[l]))}</b>: ${esc(t(VKEY[l] + 'D'))}</div>`).join('');
  if (key.startsWith('tag:')) return `<b>${esc(tagName(key.slice(4)))}</b>${esc(tagDesc(key.slice(4)))}`;
  const k = HELPKEYS[key];
  return k ? `<b>${esc(t(k[0]))}</b>${esc(t(k[1]))}` : '';
}
const qm = key => `<button type="button" class="qm" data-help="${key}" aria-label="?">?</button>`;

/* ---------- topics + filtering ---------- */
const topicCache = new WeakMap(), hayCache = new WeakMap();
function chTopics(c) {
  let s = topicCache.get(c);
  if (!s) {
    const q = (c.queries || []).join(' | ');
    s = new Set(TOPICS.filter(tp => tp[4].test(q)).map(tp => tp[0]));
    topicCache.set(c, s);
  }
  return s;
}
function hay(c) {
  let h = hayCache.get(c);
  if (h == null) { h = (c.name + ' ' + (c.handle || '') + ' ' + (c.queries || []).join(' ') + ' ' + (c.descr || '') + ' ' + c.series.map(s => s.t).join(' ')).toLowerCase(); hayCache.set(c, h); }
  return h;
}
function langOk(c) {
  if (S.lang === 'all') return true;
  if (S.lang === 'en') return c.english;
  if (S.lang === 'th') return c.lang === 'th';
  return !c.english;
}
const baseOk = c => (!S.topic || chTopics(c).has(S.topic)) && langOk(c);
function channelsFiltered(ignoreScore) {
  const q = S.q.trim().toLowerCase(), det = S.detail;
  const hideOne = det ? S.hideOne : S.tag !== 'One-hit';   // simple view always hides one-hit wonders unless asked for them
  const list = DATA.channels.filter(c => baseOk(c) &&
    (ignoreScore || c.score >= S.minScore) && (!S.maxSubs || c.subs <= S.maxSubs) && (!det || c.med_recent >= S.minMed) &&
    (!hideOne || !c.tags.includes('One-hit')) && (!S.tag || c.tags.includes(S.tag)) && (!S.niche || (c.queries || []).includes(S.niche)) &&
    (!q || hay(c).includes(q)));
  const key = {score: c => c.score, med: c => c.med_recent, ratio: c => c.ratio, best: c => c.max_views, small: c => -c.subs, trend: c => c.trend}[S.sort] || (c => c.score);
  return list.sort((a, b) => key(b) - key(a));
}
const videoPool = chs => { const out = []; for (const c of chs) for (const v of c.series) out.push([v, c]); return out; };
function viralVideos(chs) {
  const ref = nowTs();
  const heat = ([v]) => Math.min(v.x, 60) * Math.log10(Math.max(v.v, 10)) * (when(v) && ref - when(v) < 14 * 86400 ? 1.5 : 1) * (grow(v) >= 1000 ? 2 : 1);
  const seen = new Set();
  return videoPool(chs.filter(c => !c.tags.includes('One-hit'))).filter(([v]) => v.v >= 100000 && v.x >= 3)
    .sort((a, b) => heat(b) - heat(a)).filter(([, c]) => !seen.has(c.ch_id) && seen.add(c.ch_id));
}
function liveVideos(chs) {
  const cutoff = nowTs() - 72 * 3600;
  return videoPool(chs).filter(([v]) => when(v) >= cutoff).sort((a, b) => when(b[0]) - when(a[0]));
}
function picksList() {
  const rank = c => { const tt = c.pick.tier || '', m = /#(\d+)/.exec(tt); return m ? +m[1] : /strong/i.test(tt) ? 20 : 30; };
  return DATA.channels.filter(c => c.pick).sort((a, b) => rank(a) - rank(b) || b.score - a.score);
}

/* ---------- pieces ---------- */
function avatarEl(c, size) {
  const hue = [...(c.ch_id || '')].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 360;
  const letter = esc(([...(c.name || '?')][0] || '?').toUpperCase());
  const remote = STATIC && /^https:\/\/(yt3\.ggpht\.com|yt3\.googleusercontent\.com)\//.test(c.avatar_url || '') ? c.avatar_url : '';
  const local = c.avatar_ok && chOk(c.ch_id) ? (SERVER ? `/avatar/${c.ch_id}` : STATIC ? `avatars/${c.ch_id}.jpg` : '') : '';
  const src = c.avatar_data || local || remote;
  const img = src ? `<img src="${esc(src)}" alt="" decoding="async">` : '';
  return `<span class="av" style="width:${size}px;height:${size}px;background:hsl(${hue} 38% 36%);font-size:${Math.round(size * 0.42)}px"><b>${letter}</b>${img}</span>`;
}
function langChip(c) {

}

    `<img loading="lazy" src="${thumb(v.id)}" alt="">` +
    (v.x >= 2 ? `<span class="x ${badgeClass(v.x)}">${fmtX(v.x)}×</span>` : '') +
    (g ? `<span class="g">+${esc(fmt(g))}/${UI === 'th' ? 'ชม.' : 'h'}</span>` : '') +

const topVids = (c, n) => c.series.slice().sort((a, b) => b.v - a.v).slice(0, n);

function pickCard(c) {

    <div class="chsub">${vdPill(c)}<span>${esc(t('subscribers', {n: fmt(c.subs)}))}</span></div>

function statPills(c, f) {
  const top = c.series.reduce((a, b) => (b.v > a.v ? b : a), c.series[0] || {v: c.max_views});
  const st = (icon, val, label, help) => `<span class="st">${icon} <b>${esc(val)}</b><span>${esc(label)}</span>${help ? qm(help) : ''}</span>`;
  let h = st('👁', fmt(c.med_recent), t('lTypical'), 'typical') + st('🏆', fmt(top.v), t('lBest'), 'best');
  if (f.freq) h += `<span class="st">📅 <span>${esc(freqText(f.freq))}</span>${qm('freq')}</span>`;
  if (S.detail) {
    h += st('⚡', fmtX(c.ratio) + '×', t('lRatio'), 'ratio') + st('🎯', t('hitsVal', {k: c.series.filter(v => v.v >= 1e5).length, n: c.series.length}), t('lHits'), 'hits') +
      st('📈', fmtX(c.trend) + '×', t('lTrend'), 'trend') +
      c.tags.map(k => `<button type="button" class="tag ${TAGS[k] ? TAGS[k].cls : ''}" data-help="tag:${esc(k)}">${esc(tagName(k))}</button>`).join('');

const emptyBox = (msg, em = '🔍') => `<div class="empty"><span class="em">${em}</span>${esc(msg)}</div>`;

/* ---------- pages ---------- */
const pageHead = (tk, dk, extra = '') => `<div class="phead"><h1>${esc(t(tk))}</h1><p>${esc(t(dk))}</p></div>${extra}`;
const moreBtn = (kind, left) => (left > 0 ? `<button type="button" class="more" data-more="${kind}">${esc(t('more', {n: left}))}</button>` : '');
function statusInfo() {
  const st = DATA.status || {};

  if (st.state === 'scanning') return {cls: 'dot live', txt: t(st.phase === 'discovery' ? 'stDisc' : 'stProbe', {a: st.done, b: st.total})};
  if (st.state === 'starting') return {cls: 'dot', txt: t('stStart')};
  if (STATIC) return {cls: 'dot live', txt: t('stUpdated', {ago: ago(DATA.generated || st.last_cycle_end)})};
  return {cls: 'dot', txt: t('stIdle', {ago: ago(st.last_cycle_end)}) + (st.next_scan ? t('stNext', {n: Math.max(1, Math.round((st.next_scan - Date.now() / 1000) / 60))}) : '')};
}
function homeView() {
  const chs = DATA.channels.filter(baseOk);
  let h = '', n = 0;
  if (!LS.get('radar.heroHidden', false)) {
    h += `<section class="hero"><div class="emo">📡</div><div><h2>${esc(t('heroTitle'))}</h2><p>${esc(t('heroBody'))}</p>
      <div class="btns"><button type="button" class="pillbtn big red" data-intro>${esc(t('introBtn'))}</button><button type="button" class="pillbtn big" data-herohide>${esc(t('heroHide'))}</button></div></div>
      <button type="button" class="icon closex" data-herohide aria-label="${esc(t('dClose'))}">${ICON.close}</button></section>`;
  }
  const st = statusInfo();
  h += `<div class="sumline"><span>${t('sumTracked', {n: DATA.channels.length})}</span><span>${t('sumHot', {n: DATA.channels.filter(c => c.score >= 65).length})}</span>` +
    `<span>${t('sumNew', {n: liveVideos(DATA.channels).length})}</span><span class="livebox" style="margin:0"><span class="${st.cls}"></span>${esc(st.txt)}</span></div>`;
  const add = (title, desc, items, see) => { if (items.length) { h += shelf(title, desc, items, see); n++; } };
  const byScore = (a, b) => b.score - a.score;
  add('shPicks', 'shPicksD', picksList().filter(baseOk).map(pickCard), '');
  add('shViral', 'shViralD', viralVideos(chs).slice(0, 18).map(([v, c]) => vCard(v, c)), 'videos');

  render(); window.scrollTo(0, 0);

  if (!r.ok) { SEARCH.state = 'error'; SEARCH.msg = r.error === 'busy' ? t('sBusy') : t('sErr'); render(); return; }

async function pollSearch() {
  clearTimeout(searchTimer);
  if (!SEARCH || !SEARCH.id) return;
  try {
    const r = await fetch('/api/search?id=' + encodeURIComponent(SEARCH.id), {cache: 'no-store'});
    const d = await r.json();
    if (r.ok) Object.assign(SEARCH, {state: d.state, phase: d.phase, done: d.done, total: d.total, found: d.found, channels: d.channels, error: d.error});
    else { SEARCH.state = 'error'; SEARCH.msg = t('sErr'); }
  } catch (e) { SEARCH.state = 'error'; SEARCH.msg = t('sErr'); }
  if (S.tab === 'search') renderContent();
  if (SEARCH.state === 'running') searchTimer = setTimeout(pollSearch, 1200);

let POP_BTN = null, toastTimer = null;
const topLayer = () => ['player', 'intro', 'dlg', 'sheet'].map(id => $('#' + id)).find(d => d.open) || document.body;
function closePop() { $('#pop').style.display = 'none'; POP_BTN = null; }
function showPop(btn, html) {
  const pop = $('#pop'), host = topLayer();
  if (pop.parentNode !== host) host.appendChild(pop);
  pop.innerHTML = html; pop.style.display = 'block';
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  pop.style.top = (r.bottom + h + 12 > innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8) + 'px';
  POP_BTN = btn;
}
function toast(msg) {
  const el = $('#toast'), host = topLayer();
  if (el.parentNode !== host) host.appendChild(el);
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = s; topLayer().appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}

function weekData() {
  const wk = nowTs() - 7 * 86400, per = new Map();
  const vids = videoPool(DATA.channels).filter(([v]) => when(v) >= wk).sort((a, b) => b[0].v - a[0].v)
    .filter(([, c]) => { const n = per.get(c.ch_id) || 0; per.set(c.ch_id, n + 1); return n < 2; }).slice(0, 10);
  const chans = DATA.channels.map(c => { const w = c.series.filter(v => when(v) >= wk); return {c, n: w.length, v: w.reduce((a, x) => a + x.v, 0)}; })
    .filter(r => r.n).sort((a, b) => b.v - a.v).slice(0, 10);
  const fresh = DATA.channels.filter(c => c.found && c.found >= wk).sort((a, b) => b.score - a.score).slice(0, 10);
  const climb = DATA.channels.map(c => {
    const h = (c.hist || []).filter(p => p[0] >= wk);
    if (h.length < 2) return null;
    const a = h[0], b = h[h.length - 1], days = (b[0] - a[0]) / 86400;
    return days >= 0.5 && b[1] > a[1] ? {c, gain: b[1] - a[1], pct: a[1] ? (b[1] - a[1]) / a[1] : 0, days} : null;
  }).filter(Boolean).sort((a, b) => b.gain - a.gain).slice(0, 10);
  return {vids, chans, fresh, climb};
}

/* ---------- idea lab: what winning titles have in common ---------- */
const EMO = /\p{Extended_Pictographic}/u, EMO_G = /\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*/gu;
const SEG = (() => { try { return new Intl.Segmenter(undefined, {granularity: 'word'}); } catch (e) { return null; } })();   // splits Thai, which has no spaces
const STOP_TH = new Set('และ ที่ ของ ใน ไม่ ได้ ให้ เป็น มี ว่า จะ กับ แต่ ก็ นี้ คือ จาก ไป มา แล้ว เลย นะ ครับ ค่ะ คะ หรือ อยู่ ทำ กัน ซึ่ง เขา เรา คุณ ผม ฉัน มัน นั้น นี่ อะไร ยัง ถ้า ตอน'.split(' '));
function titleWords(title) {
  const clean = String(title).replace(/#[\p{L}\p{N}_]+/gu, ' ').replace(EMO_G, ' ');
  return SEG ? [...SEG.segment(clean)].filter(s => s.isWordLike).map(s => s.segment.toLowerCase()) : (clean.toLowerCase().match(/[\p{L}\p{N}']+/gu) || []);
}
const isStop = w => w.length < 2 || /^\d+$/.test(w) || STOP_TH.has(w) || Object.values(STOP).some(s => s.has(w));
const quant = (a, q) => a[Math.min(a.length - 1, Math.max(0, Math.round(q * (a.length - 1))))];
function patterns(chs) {
  const all = videoPool(chs), isWin = v => v.x >= 2 && v.v >= 100000;
  const win = all.filter(([v]) => isWin(v)).map(([v]) => v), rest = all.filter(([v]) => !isWin(v)).map(([v]) => v);
  if (win.length < 8) return null;
  const share = (list, fn) => Math.round(100 * list.filter(v => fn(v.t)).length / Math.max(1, list.length));
  const feats = [['ideaQ', 'ideaRQ', s => /[?？]/.test(s)], ['ideaNum', 'ideaRNum', s => /\d/.test(s)], ['ideaEmoji', 'ideaREmoji', s => EMO.test(s)],
    ['ideaCaps', 'ideaRCaps', s => /\b[A-Z]{3,}\b/.test(s)], ['ideaTag', 'ideaRTag', s => /#[\p{L}\p{N}_]/u.test(s)]]
    .map(([k, rk, fn]) => ({k, rk, a: share(win, fn), b: share(rest, fn)}));
  const wordsIn = list => median(list.map(v => titleWords(v.t).length).filter(Boolean)) || 0;
  const ds = win.map(v => v.d).filter(d => d > 0 && d <= 180).sort((a, b) => a - b);
  const count = (list, fn) => { const m = new Map(); list.forEach(v => new Set(fn(v.t)).forEach(w => m.set(w, (m.get(w) || 0) + 1))); return m; };
  const keyWords = s => titleWords(s).filter(w => !isStop(w));
  const ww = count(win, keyWords), rw = count(rest, keyWords);
  const words = [...ww.entries()].filter(([, n]) => n >= 3).map(([w, n]) => ({w, n, lift: (n / win.length) / (((rw.get(w) || 0) + 1) / (rest.length + 1))}))
    .sort((a, b) => b.n * Math.min(b.lift, 4) - a.n * Math.min(a.lift, 4)).slice(0, 16);
  const top = (m, k) => [...m.entries()].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, k);
  const seen = new Set();
  const examples = all.filter(([v]) => isWin(v)).sort((a, b) => Math.min(b[0].x, 50) * Math.log10(b[0].v) - Math.min(a[0].x, 50) * Math.log10(a[0].v))
    .filter(([, c]) => !seen.has(c.ch_id) && seen.add(c.ch_id)).slice(0, 10);
  return {
    nWin: win.length, nRest: rest.length, feats, words, examples, wWin: Math.round(wordsIn(win)), wRest: Math.round(wordsIn(rest)),
    len: ds.length >= 5 ? [quant(ds, 0.25), quant(ds, 0.75)] : null,
    emoji: top(count(win, s => s.match(EMO_G) || []), 10),
    tags: top(count(win, s => (s.match(/#[\p{L}\p{N}_]+/gu) || []).map(x => x.toLowerCase())), 10),
    starts: top(count(win, s => { const w = titleWords(s); return w.length >= 2 ? [w.slice(0, 2).join(' ')] : []; }), 8)
  };
}

function detectLang(texts) {
  const text = texts.filter(Boolean).join(' ').replace(/#\w+|https?:\/\/\S+/g, ' ');
  const letters = [...text].filter(c => /\p{L}/u.test(c)).length;
  if (!letters) return 'und';
  const counts = SCRIPTS.map(([code, rx]) => [code, (text.match(rx) || []).length]);
  if ((counts.find(c => c[0] === 'ja') || [0, 0])[1] >= 0.1 * letters) return 'ja';
  const top = counts.reduce((a, b) => (b[1] > a[1] ? b : a));
  if (top[1] >= 0.3 * letters) return top[0];
  const words = text.toLowerCase().match(/[a-zà-ÿ']+/g) || [];
  let best = 'und', bs = 0;
  for (const [k, set] of Object.entries(STOP)) { const s = words.filter(w => set.has(w)).length; if (s > bs) { best = k; bs = s; } }
  return bs >= 2 ? best : 'und';
}
function parseDur(iso) {
  const m = /^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || '');
  return m ? (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0) : 1e6;
}
async function ytApi(path, params) {
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set('key', getKey());
  let r;
  try { r = await fetch(u.toString()); } catch (e) { throw {net: true}; }
  if (!r.ok) {
    let body = {}; try { body = await r.json(); } catch (e) {}
    if (r.status === 403 && /quota/i.test(JSON.stringify(body))) throw {quota: true};
    if (r.status === 400 || r.status === 403) throw {badKey: true};
    throw {http: r.status};
  }
  return r.json();
}
const parseVideo = it => ({
  id: it.id, t: (it.snippet || {}).title || '', ch: (it.snippet || {}).channelId,
  v: it.statistics && it.statistics.viewCount != null ? +it.statistics.viewCount : null,
  dur: parseDur(it.contentDetails && it.contentDetails.duration), p: (it.snippet || {}).publishedAt ? Date.parse(it.snippet.publishedAt) / 1000 : null
});
async function probeStatic(chId, info, query) {
  const pl = await ytApi('playlistItems', {part: 'contentDetails', playlistId: 'UU' + chId.slice(2), maxResults: 50});
  const ids = (pl.items || []).map(i => i.contentDetails && i.contentDetails.videoId).filter(Boolean);
  if (!ids.length) return null;
  const vr = await ytApi('videos', {part: 'snippet,statistics,contentDetails', id: ids.join(',')});
  const byId = new Map((vr.items || []).map(it => [it.id, parseVideo(it)]));
  const vids = ids.map(i => byId.get(i)).filter(v => v && v.v != null && v.dur <= 180).slice(0, 24)
    .map(v => ({id: v.id, t: v.t, v: v.v, ...(v.p ? {p: Math.round(v.p)} : {}), ...(v.dur < 1e6 ? {d: v.dur} : {})}));
  const sn = (info && info.snippet) || {}, st = (info && info.statistics) || {}, th = sn.thumbnails || {};
  const subs = st.hiddenSubscriberCount ? 0 : +(st.subscriberCount || 0);
  const m = computeMetrics(vids, subs);
  if (!m) return null;
  const descr = (sn.description || '').replace(/\s+/g, ' ').trim().slice(0, 400);
  const lang = detectLang(vids.map(v => v.t).concat([descr]));
  return Object.assign({ch_id: chId, name: sn.title || chId, handle: sn.customUrl || '', subs, lang, english: lang === 'en' || lang === 'und',
    queries: [query], series: vids, watch: false, descr, avatar_url: (th.medium || th.default || {}).url || '', pick: null}, m);
}
async function staticSearch(query) {
  if (!getKey()) { go('channels'); return; }   // no key: the typed words already filter our own list
  const ck = query.toLowerCase(), hit = searchCache().find(x => x.q === ck && Date.now() - x.t < 12 * 3600e3);
  enterSearch();
  const base = {query, id: 'web', phase: '', done: 0, total: 0, found: 0, channels: [], error: null, tracked: false, msg: ''};
  if (hit) { SEARCH = Object.assign(base, {state: 'done', channels: hit.channels, cachedAt: hit.t / 1000}); render(); window.scrollTo(0, 0); return; }
  if (!ownKey() && !takeFreeSearch()) { SEARCH = Object.assign(base, {state: 'error', msg: t('sLimit'), limit: true}); render(); window.scrollTo(0, 0); return; }
  const mine = SEARCH = Object.assign(base, {state: 'running', phase: 'searching'});
  render(); window.scrollTo(0, 0);
  const paint = () => { if (S.tab === 'search' && SEARCH === mine) renderContent(); };
  try {
    const thai = /[฀-๿]/.test(query);
    const sr = await ytApi('search', Object.assign({part: 'id', type: 'video', order: 'viewCount', videoDuration: 'short', maxResults: 50, q: query,
      publishedAfter: new Date(Date.now() - 30 * 864e5).toISOString()}, thai ? {relevanceLanguage: 'th', regionCode: 'TH'} : {}));
    const ids = (sr.items || []).map(i => i.id && i.id.videoId).filter(Boolean);
    const vr = ids.length ? await ytApi('videos', {part: 'snippet,statistics,contentDetails', id: ids.join(',')}) : {items: []};
    const rows = (vr.items || []).map(parseVideo).filter(v => v.v != null && v.dur <= 180 && v.ch);
    mine.found = rows.length; mine.phase = 'checking';
    const best = new Map();
    rows.forEach(r => best.set(r.ch, Math.max(best.get(r.ch) || 0, r.v)));
    const chIds = [...best.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12).map(e => e[0]);
    mine.total = chIds.length; paint();
    const cr = chIds.length ? await ytApi('channels', {part: 'snippet,statistics', id: chIds.join(',')}) : {items: []};
    const info = new Map((cr.items || []).map(c => [c.id, c]));
    let next = 0;
    const worker = async () => {
      while (next < chIds.length) {
        const id = chIds[next++];
        try {
          const ch = await probeStatic(id, info.get(id), query);
          if (ch) { mine.channels.push(ch); mine.channels.sort((a, b) => b.score - a.score); }
        } catch (e) { if (e && (e.quota || e.badKey)) throw e; }
        mine.done++; paint();
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    mine.state = 'done';
    saveSearchCache(ck, mine.channels);
  } catch (e) {
    mine.state = 'error';
    mine.msg = e && e.quota ? t('kQuota') : e && e.badKey ? t('kBad') : e && e.net ? t('kNet') : t('sErr');
  }
  if (S.tab === 'search' && SEARCH === mine) { renderChips(); renderContent(); }
}
function openKeyDialog() {
  const dlg = $('#dlg'), body = $('#dlgBody');
  body.onclick = null;
  body.innerHTML = `<button type="button" class="icon dlgclose" data-close aria-label="${esc(t('dClose'))}">${ICON.close}</button>
    <h3>🔎 ${esc(t('kTitle'))}</h3><p>${esc(t('kWhy'))}</p>
    <ol><li>${esc(t('kS1'))} <a class="link" href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener noreferrer">${esc(t('kOpen'))} ↗</a></li>
      <li>${esc(t('kS2'))}</li><li>${esc(t('kS3'))}</li><li>${esc(t('kS4'))}</li></ol>
    <p><b>💳 ${esc(t('kNoCard'))}</b></p>
    <div class="row"><input id="keyIn" type="password" autocomplete="off" spellcheck="false" autofocus placeholder="${esc(t('kPh'))}"><button class="pillbtn red" id="keySave">${esc(t('kSave'))}</button></div>
    <p style="font-size:12.5px">${esc(t('kPrivacy'))}</p>
    <div style="text-align:right;margin-top:14px"><button class="pillbtn" id="dlgClose">${esc(t('dClose'))}</button></div>`;
  $('#keySave').onclick = () => { const v = $('#keyIn').value.trim(); if (!v) return; setKey(v); dlg.close(); if (S.q.trim().length >= 2) staticSearch(S.q.trim()); };
  $('#dlgClose').onclick = () => dlg.close();
  dlg.showModal();
}

/* ---------- data loop ---------- */
let lastSig = '';
async function refresh() {
  if (!LIVE) return;
  try {
    const r = await fetch(STATIC ? 'data.json' : '/api/data', {cache: STATIC ? 'no-cache' : 'no-store'});
    const d = await r.json();
    const sig = STATIC ? String(d.generated) : '';   // the hosted data only changes when the scanner publishes
    if (sig && sig === lastSig) return;
    lastSig = sig;
    const first = !DATA;
    DATA = d;
    if (first) { render(); afterFirstData(); return; }
    if (!$('#dlg').open) render(true); else renderSide();
  } catch (e) {
    const box = $('#side .livebox');
    if (box) box.innerHTML = `<span class="dot"></span><span>${esc(t('offline'))}</span>`;
  }
}
function afterFirstData() {
  const m = /^#ch\/(UC[\w-]{22})$/.exec(location.hash);
  if (m && findCh(m[1])) openChannel(m[1]);
  else if (/^#compare\/[\w,-]+$/.test(location.hash)) openCompareLink(location.hash.slice(1));
  else if (!LS.get('radar.welcomed', false)) openWelcome();
}
if (!hashTab() && !/^#(ch|compare)\//.test(location.hash)) history.replaceState(null, '', '#' + S.tab);
applyStaticText();
if (LIVE) { refresh(); setInterval(refresh, STATIC ? 60000 : 15000); } else { render(); afterFirstData(); }
</script>
