  s.med = s.vids.length ? median(s.vids.map(([v]) => v.v)) : 0;
  s.heat = Math.min(s.lift, 10) * s.chs.size ** 0.75 * Math.max(0.3, Math.log10(s.med + 10) - 3) ** 1.5;   // views count for a lot: a trend is only worth riding if it gets watched
  return s;
}
const newStats = (key, label) => ({key, label, r: 0, b: 0, chs: new Set(), vids: [], days: new Array(TR_DAYS).fill(0)});
function addVideo(s, v, c, age) {
  const day = Math.floor(age / 86400);
  if (day < TR_DAYS) s.days[TR_DAYS - 1 - day]++;
  if (age <= TR_RECENT) { s.r++; s.chs.add(c.ch_id); s.vids.push([v, c]); } else s.b++;
}
function windowVideos() {   // [video, channel, age] for every Short uploaded in the last 3 weeks
  const now = nowTs(), out = [];
  for (const c of DATA.channels) for (const v of c.series) { const age = v.p ? now - v.p : -1; if (age >= 0 && age <= TR_WINDOW) out.push([v, c, age]); }
  return out;
}
let TR = null;
function trendData() {   // rising words, hashtags, games and characters; worked out once per data refresh
  const sig = DATA.generated + ':' + DATA.channels.length;
  if (TR && TR.sig === sig) return TR;
  const win = windowVideos(), terms = new Map();
  for (const [v, c, age] of win) {
    const cap = capsIn(v.t);
    for (const term of termsOf(v.t)) {
      let s = terms.get(term);
      if (!s) terms.set(term, s = newStats('t:' + term, term));
      addVideo(s, v, c, age);
      if (cap.plain && age <= TR_RECENT) { s.plain = (s.plain || 0) + 1; if (cap.caps.has(term)) s.named = (s.named || 0) + 1; }
    }
  }
  const rising = [];
  for (const s of terms.values()) {   // phrases and hashtags are more telling than single words, so single words need more channels behind them
    const phrase = s.label.includes(' ') || s.label.startsWith('#');
    // a single word only counts when people write it like a name (Mbappé, Labubu), not an everyday word
    if (!phrase && !(CASED.test(s.label) && (s.plain || 0) >= 2 && (s.named || 0) / s.plain >= 0.6)) continue;
    if (s.r < (phrase ? 3 : 4) || s.chs.size < (phrase ? 2 : 3) || finishStats(s).lift < (phrase ? 1.8 : 2.2) || s.med < (phrase ? 10000 : 30000)) continue;
    if (phrase) s.heat *= 1.6;
    rising.push(s);
  }
  rising.sort((a, b) => b.heat - a.heat);
  const keep = [], words = s => s.label.replace(/#/g, '').split(' ');
  for (const s of rising) {   // skip near-copies: "grow" next to "grow garden" with about the same Shorts
    if (keep.some(k => (words(k).some(w => words(s).includes(w))) && Math.abs(k.r - s.r) <= Math.max(1, k.r * 0.3))) continue;
    s.cat = trendCat(s.label, s.vids);
    s.tops = new Set(s.vids.flatMap(([, c]) => [...chTopics(c)]));
    keep.push(s);
    if (keep.length >= 150) break;
  }
  const board = (list, pre) => list.map(([name, rx]) => {
    const s = newStats(pre + name, name);
    for (const [v, c, age] of win) if (rx.test(v.t)) addVideo(s, v, c, age);
    finishStats(s);
    s.cat = pre === 'g:' ? 'games' : 'cartoons';
    s.yt = ytMentions(rx);
    s.score = (s.r ? s.heat : 0) + s.yt.length * 2;
    return s;
  }).filter(s => s.r || s.b || s.yt.length).sort((a, b) => b.score - a.score || b.r - a.r);
  TR = {sig, terms, rising: keep, games: board(GAMES, 'g:'), toons: board(CARTOONS, 'c:')};

}

function weekGrid(ps) {   // a week grid of upload times in the viewer's own time zone; returns the grid and the busiest slot
  const g = Array.from({length: 7}, () => Array(6).fill(0));
  ps.forEach(p => { const d = new Date(p * 1000); g[(d.getDay() + 6) % 7][Math.floor(d.getHours() / 4)]++; });
  const mx = Math.max(1, ...g.flat()), loc = UI === 'th' ? 'th-TH' : 'en-US';
  const day = i => new Intl.DateTimeFormat(loc, {weekday: 'short'}).format(new Date(2024, 0, 1 + i));   // 1 Jan 2024 was a Monday
  const hr = h => new Intl.DateTimeFormat(loc, {hour: 'numeric'}).format(new Date(2024, 0, 1, h % 24));
  let best = [0, 0];
  g.forEach((row, d) => row.forEach((n, b) => { if (n > g[best[0]][best[1]]) best = [d, b]; }));
  const lvl = n => (!n ? '' : 'l' + Math.max(1, Math.ceil(4 * n / mx)));
  const cells = g.map((row, d) => `<span class="dy">${esc(day(d))}</span>` + row.map((n, b) => `<i class="${lvl(n)}" title="${esc(`${day(d)} ${hr(b * 4)}–${hr(b * 4 + 4)} · ${t('uploadsN', {n})}`)}"></i>`).join('')).join('');
  return {html: `<div class="hmap" role="img"><span></span>${[0, 1, 2, 3, 4, 5].map(b => `<span class="hd">${esc(hr(b * 4))}</span>`).join('')}${cells}</div>`,
    best: t('timesBest', {d: day(best[0]), h: `${hr(best[1] * 4)}–${hr(best[1] * 4 + 4)}`})};
}
function niches() {   // demand (typical views) against supply (how many channels post), per topic, over the last two weeks
  const now = nowTs();
  return TOPICS.map(tp => {
    const chs = DATA.channels.filter(c => chTopics(c).has(tp[0])), vids = [];
    chs.forEach(c => c.series.forEach(v => { if (v.p && now - v.p <= 14 * 86400) vids.push([v, c]); }));
    if (vids.length < 8) return null;
    const views = vids.map(([v]) => v.v), active = new Set(vids.map(([, c]) => c.ch_id)).size, med = median(views);
    const viral = vids.filter(([v]) => v.x >= 3).length / vids.length;
    const byCh = new Map(); vids.forEach(([v, c]) => byCh.set(c.ch_id, (byCh.get(c.ch_id) || 0) + v.v));
    const tot = views.reduce((a, b) => a + b, 0), top3 = [...byCh.values()].sort((a, b) => b - a).slice(0, 3).reduce((a, b) => a + b, 0) / Math.max(1, tot);
    return {tp, med, viral, active, n: vids.length, top3, raw: Math.log10(med + 10) * (1 + 4 * viral) * (1.2 - top3) / Math.sqrt(active + 1)};
  }).filter(Boolean).map((r, i, all) => Object.assign(r, {score: Math.round(100 * r.raw / Math.max(...all.map(x => x.raw)))})).sort((a, b) => b.score - a.score);
}
const HOOKS = /^(pov|what if|i tried|day \d+|how|why|this|never|watch|wait|when|if you|don'?t|stop|the (most|best|worst)|ranking|can you|เมื่อ|ถ้า|ลอง|วิธี|ทำไม|ห้าม|อย่า|รู้ไหม)/i;
const POWER = /secret|crazy|insane|impossible|never|giant|tiny|vs|versus|surprising|shocking|hidden|real|actually|finally|only|ไม่เคย|ลับ|สุด|ที่สุด|จริง|ห้าม|เทียบ/i;
function checkTitle(raw) {
  const s = raw.trim();
  if (!s) return '';
  const words = titleWords(s), tags = s.match(/#[\p{L}\p{N}_]+/gu) || [], emo = s.match(EMO_G) || [];
  const rising = trendData().rising.slice(0, 80).filter(r => termsOf(s).has(r.label));
  const checks = [
    [s.length >= 15 && s.length <= 70, t('tcLen', {n: s.length})],
    [words.length >= 3 && words.length <= 12, t('tcWords', {n: words.length})],
    [HOOKS.test(s) || /[?？]/.test(s), t('tcHook')],
    [/\d/.test(s), t('tcNum')],
    [POWER.test(s), t('tcPower')],
    [emo.length >= 1 && emo.length <= 2, t('tcEmoji', {n: emo.length})],
    [tags.length >= 1 && tags.length <= 3, t('tcTags', {n: tags.length})],
    [!/\b[A-Z]{3,}\b.*\b[A-Z]{3,}\b.*\b[A-Z]{3,}\b/.test(s), t('tcCaps')],
    [rising.length > 0, rising.length ? t('tcTrendYes', {x: rising.map(r => r.label).join(', ')}) : t('tcTrendNo')]
  ];
  const score = Math.round(100 * checks.reduce((a, [ok], i) => a + (ok ? [12, 10, 16, 10, 10, 8, 8, 6, 20][i] : 0), 0) / 100);
  const kw = new Set(words.filter(w => !isStop(w) && !NOISE.has(w)));
  const similar = kw.size ? videoPool(DATA.channels).filter(([v]) => v.x >= 2 && titleWords(v.t).some(w => kw.has(w)))
    .sort((a, b) => Math.min(b[0].x, 50) * Math.log10(b[0].v) - Math.min(a[0].x, 50) * Math.log10(a[0].v)).slice(0, 5) : [];
  return `<div class="tcres"><div class="ring" style="--p:${score};--c:${scoreColor(score)}"><span>${score}</span></div><div><b>${esc(t(score >= 75 ? 'tcGreat' : score >= 50 ? 'tcOk' : 'tcWeak'))}</b><small>${esc(t('tcScore'))}</small></div></div>
    <div class="tcl">${checks.map(([ok, txt]) => `<div class="${ok ? 'ok' : 'no'}"><span>${ok ? '✓' : '•'}</span>${esc(txt)}</div>`).join('')}</div>
    ${similar.length ? `<h4 class="antitle" style="margin-top:12px">${esc(t('tcSimilar'))}</h4><div class="tcsim">${similar.map(([v, c]) => `<button type="button" class="yrow2" data-play="${esc(v.id)}" data-c="${esc(c.ch_id)}"><img loading="lazy" src="${thumb(v.id)}" alt=""><span class="bmain"><b>${esc(v.t)}</b><small>${esc(c.name)} · ${esc(t('views', {n: fmt(v.v)}))} · ${esc(xText(v.x))}</small></span></button>`).join('')}</div>` : ''}`;
}

async function addChannel(raw) {
  const q = chFromInput(raw), say = (k, x) => { const m = $('#addMsg'); if (m) m.textContent = t(k, x); };

    try { await FBX.F.setDoc(FBX.F.doc(FBX.db, 'track', id), {t: FBX.F.serverTimestamp()}); } catch (e) {}   // already asked for: fine

/* ---------- trend alerts: a notification the moment a tracked trend takes off ---------- */
const VAPID = /^[A-Za-z0-9_-]{80,100}$/.test(CFG.vapidKey || '') ? CFG.vapidKey : '';
const b64bytes = x => Uint8Array.from(atob(x.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - x.length % 4) % 4)), c => c.charCodeAt(0));
const alertsOn = () => !!LS.get('radar.alerts', false) && 'Notification' in window && Notification.permission === 'granted';
async function savePushSub() {   // with the server worker set up, alerts arrive even when the app is closed
  if (!VAPID || !USER || !FBX || !('serviceWorker' in navigator) || !alertsOn()) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64bytes(VAPID)});
    await FBX.F.setDoc(FBX.F.doc(FBX.db, 'push', USER.uid), {sub: JSON.stringify(sub), keys: JSON.stringify(tracked().map(x => x.k)), lang: UI, t: FBX.F.serverTimestamp()}, {merge: true});
  } catch (e) {}
}
async function toggleAlerts() {
  if (alertsOn()) {
    LS.set('radar.alerts', false);
    try {
      if (USER && FBX) await FBX.F.deleteDoc(FBX.F.doc(FBX.db, 'push', USER.uid));
      const sub = 'serviceWorker' in navigator && await (await navigator.serviceWorker.ready).pushManager.getSubscription();
      if (sub) await sub.unsubscribe();
    } catch (e) {}
  } else {
    if (!('Notification' in window)) return toast(t('alNoSupport'));
    if (await Notification.requestPermission() !== 'granted') return toast(t('alBlocked'));
    LS.set('radar.alerts', true);
    await savePushSub();
    toast(t(VAPID && USER ? 'alOnPush' : 'alOnLocal'));
  }
  renderContent();
  if ($('#dlg').open && $('#dlgBody').dataset.mode === 'trend' && TREND_OPEN) openTrend(TREND_OPEN);
}
function checkLocalAlerts() {   // while the site or app is open: notify about tracked trends that just took off (at most once in 3 days each)
  if (!alertsOn() || !DATA || !('serviceWorker' in navigator)) return;
  const told = LS.get('radar.told', {}), now = Date.now();
  for (const x of tracked()) {
    const s = trendByKey(x.k);
    if (!trendHot(s) || told[x.k] > now - 3 * 86400e3) continue;
    told[x.k] = now;
    navigator.serviceWorker.ready.then(reg => reg.showNotification(t('alTitle', {x: x.l}),
      {body: t('alBody', {n: s.r, x: fmtX(Math.min(s.lift, 99))}), tag: x.k, icon: 'icons/icon-192.png', data: {url: '#trend/' + encodeURIComponent(x.k)}})).catch(() => {});
  }
  LS.set('radar.told', told);
}
const alertBtn = () => `<button type="button" class="chip ${alertsOn() ? 'on' : ''}" data-alerts>${IC.bell}${esc(t(alertsOn() ? 'alOn' : 'alEnable'))}</button>`;
